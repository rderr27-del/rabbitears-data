# Rebuilds RabbitEars' show data from TVMaze every week and publishes it to
# GitHub Pages, where the app picks it up. Takes ~30 minutes (TVMaze rate limits),
# longer when the poster cache is empty.
name: Weekly data

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: # "Run workflow" button for an on-demand rebuild

permissions:
  contents: write # commit last-run.txt (keeps the schedule alive)
  pages: write
  id-token: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  build:
    # Windows PowerShell 5.1 with System.Drawing, which the poster resizing uses.
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Build catalog
        shell: powershell
        run: .\tools\build-catalog.ps1 -OutDir public

      # Posters are kept between weekly runs so only new or changed ones are
      # downloaded. Each run saves a fresh cache entry; the newest is restored.
      # Restored before the Discover lists, whose thumbnails are made from them.
      # cache-keepalive.yml opens it mid-week so GitHub's 7-day expiry never hits.
      - name: Restore posters
        uses: actions/cache@v6
        with:
          path: public/posters
          key: posters-${{ github.run_id }}
          restore-keys: posters-

      # Reads only the schedule days history/last-aired.tsv doesn't cover yet
      # (a full year every 4 weeks); see the script's header.
      - name: Build Discover lists
        shell: powershell
        run: .\tools\build-discover.ps1 -OutDir public

      - name: Copy posters of popular shows
        shell: powershell
        run: .\tools\build-posters.ps1 -OutDir public

      - name: Package feed
        shell: powershell
        run: .\tools\build-feed.ps1 -OutDir public

      - name: Drop unpackaged files from the site
        shell: powershell
        run: |
          Remove-Item public\catalog.tsv
          Remove-Item public\catalog-meta.tsv
          Remove-Item public\discover -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: public
          retention-days: 7

      # Commits the updated trending history, plus last-run.json: GitHub disables
      # scheduled workflows after 60 days without repository activity. A failed push
      # only warns, so the site still deploys; the next run then reads a few more
      # days from the older history.
      - name: Record run
        shell: powershell
        run: |
          (Get-Content public\manifest.json -Raw) | Set-Content last-run.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.json history/last-aired.tsv
          git commit -m "Weekly data build" ; if ($LASTEXITCODE -ne 0) { exit 0 }
          git pull --rebase
          git push
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Couldn't push the trending history; the next run will catch up." }
          exit 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feed
          path: public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
