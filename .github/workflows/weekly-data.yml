# Rebuilds RabbitEars' show data from TVMaze every week and publishes it to
# GitHub Pages, where the app picks it up. Takes ~30 minutes (TVMaze rate limits).
name: Weekly data

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: # "Run workflow" button for an on-demand rebuild

permissions:
  contents: write # commit last-run.txt (keeps the schedule alive)
  pages: write
  id-token: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  build:
    # Windows PowerShell 5.1 with System.Drawing, which the poster resizing uses.
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Build catalog
        shell: powershell
        run: .\tools\build-catalog.ps1 -OutDir public

      - name: Build Discover lists
        shell: powershell
        run: .\tools\build-discover.ps1 -OutDir public

      - name: Package feed
        shell: powershell
        run: .\tools\build-feed.ps1 -OutDir public

      - name: Drop unpackaged files from the site
        shell: powershell
        run: |
          Remove-Item public\catalog.tsv
          Remove-Item public\catalog-meta.tsv
          Remove-Item public\discover -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: public
          retention-days: 7

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, so record each run with a commit.
      - name: Record run
        shell: powershell
        run: |
          (Get-Content public\manifest.json -Raw) | Set-Content last-run.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.json
          git commit -m "Weekly data build" ; if ($LASTEXITCODE -ne 0) { exit 0 }
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feed
          path: public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
